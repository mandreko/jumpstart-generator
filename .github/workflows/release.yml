name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install ImageMagick 7 from source
        run: |
          set -e

          # Install build dependencies
          sudo apt-get update
          sudo apt-get install -y build-essential wget pkg-config \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev \
            libopenjp2-7-dev libfreetype6-dev libfontconfig1-dev libltdl-dev

          # Download ImageMagick 7
          IMAGEMAGICK_VERSION=7.1.2-18
          wget https://github.com/ImageMagick/ImageMagick/archive/refs/tags/${IMAGEMAGICK_VERSION}.tar.gz

          # Verify integrity before extracting
          echo "168326e62c2ca5608a660e030b9777c7200458f9eb128854867e9bf20e1aa3d603a819aa3095fb3cf13133ceb9a9c9859374b7ce872bebb179c3afdf943ec831  ${IMAGEMAGICK_VERSION}.tar.gz" | sha512sum -c

          tar xzf ${IMAGEMAGICK_VERSION}.tar.gz
          cd ImageMagick-${IMAGEMAGICK_VERSION}

          # Configure and build
          ./configure --prefix=/usr/local \
            --with-modules \
            --enable-shared \
            --with-jpeg \
            --with-png \
            --with-tiff \
            --with-webp \
            --with-openjp2 \
            --with-freetype \
            --with-fontconfig

          # Compile and install
          make -j$(nproc)
          sudo make install
          sudo ldconfig

          # Verify installation
          magick -version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Configure AWS CLI for CloudFlare R2
        run: |
          # AWS CLI is already installed in GitHub runners
          aws --version

          # Configure AWS CLI for CloudFlare R2 (use token for both fields)
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto
          aws configure set default.output json

      - name: Build all sets
        run: npm run rebuild
        env:
          RENDER_PARALLEL: 2
          RENDER_PAGES: 2

      - name: Get version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=manual-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Create and upload zip files to CloudFlare R2
        run: |
          # Extract set codes from sets.json
          sets=$(jq -r '.[].set' sets.json)
          version="${{ steps.get_version.outputs.version }}"

          # Create zip for each set and upload to R2
          for set in $sets; do
            echo "Creating zip for $set..."
            mkdir -p "temp/$set"

            # Copy front images for this set
            if ls output/front-images/${set}-*.jpg 1> /dev/null 2>&1; then
              mkdir -p "temp/$set/front-images"
              cp output/front-images/${set}-*.jpg "temp/$set/front-images/"
            fi

            # Copy back images for this set
            if ls output/back-images/${set}-*.jpg 1> /dev/null 2>&1; then
              mkdir -p "temp/$set/back-images"
              cp output/back-images/${set}-*.jpg "temp/$set/back-images/"
            fi

            # Copy the bulk import file for this set
            if [ -f "output/cardconjurer-import-files/${set}-saved-cards.cardconjurer" ]; then
              mkdir -p "temp/$set/cardconjurer-import-files"
              cp "output/cardconjurer-import-files/${set}-saved-cards.cardconjurer" "temp/$set/cardconjurer-import-files/"
            fi

            # Create the zip file
            cd temp/$set
            zip_name="${set}-cards.zip"
            zip -r "$zip_name" .

            # Upload to CloudFlare R2
            echo "Uploading $zip_name to CloudFlare R2..."
            aws s3 cp "$zip_name" "s3://${{ secrets.R2_BUCKET_NAME }}/$version/$zip_name" \
              --endpoint-url "${{ secrets.R2_ENDPOINT_URL }}"

            cd ../..

            # Cleanup temp directory
            rm -rf "temp/$set"
          done

          # Create and upload all-sets zip
          echo "Creating all-sets zip..."
          cd output
          zip -r "all-sets-cards.zip" front-images/ back-images/ cardconjurer-import-files/

          echo "Uploading all-sets-cards.zip to CloudFlare R2..."
          aws s3 cp "all-sets-cards.zip" "s3://${{ secrets.R2_BUCKET_NAME }}/$version/all-sets-cards.zip" \
            --endpoint-url "https://${{ secrets.R2_ENDPOINT_URL }}.r2.cloudflarestorage.com"

          cd ..

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            MTG Jumpstart Card Generator - Ready-to-print cards

            This release contains printable card files for all supported Jumpstart sets.

            ## Available Sets
            - **MSH** - Marvel Super Heroes Jumpstart
            - **TLA** - Avatar
            - **DMU** - Dominaria United Jumpstart
            - **J25** - Foundations
            - **J22** - Jumpstart 2022
            - **LTR** - Lord of the Rings: Tales of Middle-earth Jumpstart
            - **MOM** - March of the Machine Jumpstart
            - **ONE** - Phyrexia: All Will Be One Jumpstart
            - **BRO** - The Brothers' War Jumpstart

            ## Download Links

            **Individual Sets:**
            - [MSH-cards.zip](https://pub-b1158a5e66b14ff3b0ba07735c5b3127.r2.dev/${{ steps.get_version.outputs.version }}/MSH-cards.zip) - Marvel Super Heroes
            - [TLA-cards.zip](https://pub-b1158a5e66b14ff3b0ba07735c5b3127.r2.dev/${{ steps.get_version.outputs.version }}/TLA-cards.zip) - Avatar
            - [DMU-cards.zip](https://pub-b1158a5e66b14ff3b0ba07735c5b3127.r2.dev/${{ steps.get_version.outputs.version }}/DMU-cards.zip) - Dominaria United
            - [J25-cards.zip](https://pub-b1158a5e66b14ff3b0ba07735c5b3127.r2.dev/${{ steps.get_version.outputs.version }}/J25-cards.zip) - Foundations
            - [J22-cards.zip](https://pub-b1158a5e66b14ff3b0ba07735c5b3127.r2.dev/${{ steps.get_version.outputs.version }}/J22-cards.zip) - Jumpstart 2022
            - [LTR-cards.zip](https://pub-b1158a5e66b14ff3b0ba07735c5b3127.r2.dev/${{ steps.get_version.outputs.version }}/LTR-cards.zip) - Lord of the Rings
            - [MOM-cards.zip](https://pub-b1158a5e66b14ff3b0ba07735c5b3127.r2.dev/${{ steps.get_version.outputs.version }}/MOM-cards.zip) - March of the Machine
            - [ONE-cards.zip](https://pub-b1158a5e66b14ff3b0ba07735c5b3127.r2.dev/${{ steps.get_version.outputs.version }}/ONE-cards.zip) - Phyrexia: All Will Be One
            - [BRO-cards.zip](https://pub-b1158a5e66b14ff3b0ba07735c5b3127.r2.dev/${{ steps.get_version.outputs.version }}/BRO-cards.zip) - The Brothers' War

            **All Sets Combined:**
            - [all-sets-cards.zip](https://pub-b1158a5e66b14ff3b0ba07735c5b3127.r2.dev/${{ steps.get_version.outputs.version }}/all-sets-cards.zip) - Complete collection (~250MB)

            ## Files
            Each zip contains:
            - `front-images/` - Processed card front images (738×1002px, ready for MPC)
            - `back-images/` - Rendered card back images from CardConjurer (ready for MPC)
            - `cardconjurer-import-files/` - Bulk import file for CardConjurer.app

            ## Usage
            1. Download the zip for your desired set(s)
            2. Upload front-images and back-images to makeplayingcards.com
            3. (Optional) Use the `.cardconjurer` file with CardConjurer.app for customization

            See the [USAGE.md](https://github.com/${{ github.repository }}/blob/main/USAGE.md) for detailed instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
